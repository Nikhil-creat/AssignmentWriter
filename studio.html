<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Studio — Sheetstudio</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><meta name="theme-color" content="#0f1626">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:wght@400;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
<link rel="stylesheet" href="assets/pro.css">
<style>
:root{--n:#0f1626;--ink:#f4f6fa;--i72:rgba(244,246,250,.72);--i46:rgba(244,246,250,.46);--lime:#c6ff2e;--cy:#3fd8ff;--hair:rgba(255,255,255,.22);--card:rgba(255,255,255,.04)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--n);color:var(--ink);font:400 15px/1.45 'Inter Tight',system-ui,sans-serif;height:100%}
a{color:inherit;text-decoration:none}
nav{position:fixed;inset:0 0 auto;height:58px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;z-index:20;background:rgba(15,22,38,.92);backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.08)}
nav .l,nav .r{display:flex;align-items:center;gap:10px;font:500 11.5px 'Inter Tight';text-transform:uppercase;letter-spacing:.06em}nav .r{justify-content:flex-end}
.logo{font-weight:700;font-size:19px;letter-spacing:.06em}
.pill,.btn{height:40px;padding:0 18px;border-radius:99px;border:0;display:inline-flex;align-items:center;justify-content:center;background:#2a3245;color:var(--ink);font:600 11.5px 'Inter Tight';letter-spacing:.05em;text-transform:uppercase;cursor:pointer;transition:transform .2s,opacity .2s}
.pill.lime,.btn-generate{background:var(--lime);color:var(--n)}.btn-ghost{background:transparent;border:1px solid var(--hair)}
.pill:hover,.btn:hover:not(:disabled){transform:translateY(-1px)}.btn:disabled{opacity:.5;cursor:wait}
.app{display:grid;grid-template-columns:350px 1fr;height:100vh;padding-top:58px}
#sidebar{overflow:auto;padding:18px;display:flex;flex-direction:column;gap:14px;border-right:1px solid rgba(255,255,255,.08)}
.brand h1{font-size:22px;font-weight:600;letter-spacing:-.03em}.brand p{color:var(--i46);font-size:13px}
.card{background:var(--card);border:1px solid var(--hair);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font:600 11px 'Inter Tight';letter-spacing:.06em;text-transform:uppercase;color:var(--i46)}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
input,select,textarea{width:100%;background:#0b1220;border:1px solid var(--hair);color:var(--ink);border-radius:10px;padding:9px 11px;font:400 14px 'Inter Tight',sans-serif;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--cy)}
input[type=checkbox],input[type=range]{width:auto;accent-color:var(--lime)}
textarea.q-text{min-height:78px;resize:vertical}
.field-label{font-size:11px;color:var(--i46);display:block;margin-bottom:3px}
.toggle-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--i72)}
.status{font-size:12px;color:var(--i46);min-height:14px;line-height:1.4}.status.ok{color:var(--lime)}.status.error{color:#ff8a8a}
main{display:flex;flex-direction:column;min-width:0;padding:14px;gap:10px;height:100%}
.bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.seg{height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--hair);background:transparent;color:var(--i72);font:600 11.5px 'Inter Tight';cursor:pointer}.seg.on{background:#fff;color:var(--n);border-color:#fff}
.stats{margin-left:auto;color:var(--i46);font-size:12px}.tabs{display:none}
.panels{flex:1;display:flex;gap:12px;min-height:0}.panel{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.pt{font:600 11px 'Inter Tight';letter-spacing:.06em;text-transform:uppercase;color:var(--i46);display:flex;justify-content:space-between;align-items:center}
#markdown-input{flex:1;resize:none;font:12.5px/1.55 ui-monospace,Consolas,monospace;border-radius:14px;padding:14px}
#preview-wrap{flex:1;position:relative;border-radius:14px;overflow:hidden;background:#fff}
#preview{height:100%;overflow:auto;padding:36px 42px;background:#fff;color:#1e293b;font:400 15.5px/1.8 'Source Serif 4',Georgia,serif}
#preview h1{font-size:1.35rem;border-bottom:2px solid #0f1626;padding-bottom:6px;margin:1em 0 .4em;color:#0f1626}#preview h2{font-size:1.08rem;color:#1d4ed8;margin:1em 0 .3em}#preview h3{font-size:1rem;margin:.8em 0 .2em}
#preview p{margin-bottom:.9em;text-align:justify}#preview ul,#preview ol{margin:0 0 .9em 1.4em}
#preview table{border-collapse:collapse;width:100%;margin:1.2em 0;font:.88rem 'Inter Tight',sans-serif}#preview th,#preview td{border:1px solid #94a3b8;padding:7px 10px;text-align:left}#preview th{background:#f1f5f9}
#preview blockquote{border-left:3px solid #2563eb;background:#f8fafc;padding:8px 14px;margin:1em 0;font-size:.92rem}
#preview pre{background:#f8fafc;border:1px solid #e2e8f0;border-radius:8px;padding:12px;overflow:auto;margin-bottom:1em;font:.82rem/1.5 ui-monospace,Consolas,monospace}
.mermaid{display:flex;justify-content:center;margin:18px 0}.fb{background:#fef2f2;border:1px solid #fecaca;color:#991b1b;border-radius:8px;padding:10px 12px;margin:14px 0;font:.85rem 'Inter Tight',sans-serif}
mark.name{background:#fde68a;color:#78350f;padding:0 2px;border-radius:3px;font-weight:600}mark.key{background:#bbf7d0;color:#14532d;padding:0 2px;border-radius:3px;font-weight:600}
#preview.nokey mark.key{background:none;color:inherit;font-weight:700}
.strip{display:flex;flex-wrap:wrap;gap:4px 16px;border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;padding:9px 13px;margin-bottom:18px;font:.78rem 'Inter Tight',sans-serif}.strip b{color:#0f1626}
.page-break{height:1px;margin:24px 0;border-top:2px dashed #cbd5e1}
#preview.hw{font:500 calc(1.32rem*var(--hw,1))/calc(2.15em) 'Caveat',cursive;color:#1d3a8a;padding-left:60px;border-left:3px solid #dc2626;margin-left:18px;background:repeating-linear-gradient(#fff,#fff calc(2.15em - 1px),#c7d6f5 calc(2.15em - 1px),#c7d6f5 2.15em) 0 8px}
#preview.hw p{text-align:left;font-size:1.2em}#preview.hw h1,#preview.hw h2,#preview.hw h3{font-family:'Caveat',cursive;color:#7c2d12}#preview.hw table,#preview.hw .strip{font-family:'Caveat',cursive}
#toast{position:fixed;bottom:18px;right:18px;background:#fff;color:var(--n);padding:10px 16px;border-radius:99px;font-weight:600;font-size:13px;opacity:0;transform:translateY(8px);transition:.25s;z-index:60;pointer-events:none}#toast.show{opacity:1;transform:none}
#preview table,#preview .mermaid,#preview pre,#preview blockquote,.strip{break-inside:avoid}#preview h1,#preview h2,#preview h3{break-after:avoid}
@media(max-width:900px){body{height:auto}.app{display:block;height:auto}#sidebar{border:0;overflow:visible}main{height:auto;min-height:100vh}.tabs{display:flex;gap:8px}.panels{display:block}.panel{display:none;height:78vh}.panels[data-v=edit] #edit,.panels[data-v=prev] #prevp{display:flex}nav{grid-template-columns:1fr auto}nav .l{display:none}.pill{height:34px;padding:0 12px}#preview{padding:22px 18px}}
@media print{nav,#sidebar,.bar,.tabs,#toast,.pt{display:none!important}html,body,.app,main{display:block;height:auto;overflow:visible;background:#fff;padding:0}.panels{display:block}#edit{display:none!important}#prevp{display:block!important}#preview-wrap{overflow:visible;border-radius:0}#preview{overflow:visible;height:auto;padding:0}@page{margin:18mm 20mm 16mm}.page-break{break-before:page;border:0;margin:0;height:0}#preview.hw{background-attachment:local}}
</style></head><body>
<nav><div class="l"><a href="./">← Home</a></div><a class="logo" href="./">SHEETSTUDIO</a>
<div class="r"><a class="pill" href="https://console.groq.com/keys" target="_blank" rel="noopener">Free key</a><button class="pill lime" id="b-print" type="button">Export PDF</button></div></nav>
<div class="app"><aside id="sidebar">
<div class="brand"><h1>Studio</h1><p>JNTUH-style answers, diagrams and print-ready sheets.</p></div>
<div class="card"><h2>Student details</h2>
<div class="row"><div><label class="field-label">Name</label><input id="d-name" value="Nikhil Chary Sriramoju"></div><div><label class="field-label">Roll no.</label><input id="d-roll" placeholder="e.g. 23641A05K6"></div></div>
<div class="row"><div><label class="field-label">Class</label><input id="d-class" value="B.Tech CSE"></div><div><label class="field-label">Year</label><input id="d-year" value="Final Year"></div></div>
<div class="row"><div><label class="field-label">Group</label><input id="d-group" placeholder="e.g. CSE"></div><div><label class="field-label">Section</label><input id="d-section" placeholder="e.g. D"></div></div>
<div><label class="field-label">College</label><input id="d-college" value="Vaagdevi College of Engineering"></div>
<div><label class="field-label">Faculty name</label><input id="d-faculty" placeholder="Faculty name"></div>
<div><label class="field-label">Faculty email</label><input id="d-femail" type="email" placeholder="faculty@college.edu"></div>
<div class="toggle-row"><input type="checkbox" id="t-strip" checked><label for="t-strip">Show details strip on the sheet</label></div>
<div class="toggle-row"><input type="checkbox" id="t-key" checked><label for="t-key">Highlight key points (==term==)</label></div></div>
<div class="card"><h2>Document tools</h2>
<div class="row"><button class="btn btn-ghost" id="b-copy" type="button">Copy .md</button><button class="btn btn-ghost" id="b-dl" type="button">Download .md</button></div>
<div class="row"><button class="btn btn-ghost" id="b-sample" type="button">Load sample</button><button class="btn btn-ghost" id="b-clear" type="button">Clear all</button></div>
<div class="status">Drafts autosave in this browser.</div></div>
<div class="card"><h2>Submit to faculty</h2><button class="btn btn-generate" id="b-send" type="button">Send to faculty</button><div class="status" id="send-s">Shares the .md file, or opens your email app. Attach the exported PDF for the best result.</div></div>
</aside>
<main><div class="bar"><button class="seg on" id="m-sys" type="button">System</button><button class="seg" id="m-hw" type="button">Handwritten</button>
<span id="hw-size" style="display:none;align-items:center;gap:6px;color:var(--i46);font-size:12px">Size <input type="range" id="hw-r" min=".85" max="1.3" step=".05" value="1" style="width:90px"></span>
<button class="seg" id="b-diag" type="button">+ Mermaid diagram</button><span class="stats" id="stats"></span></div>
<div class="tabs"><button class="seg on" data-v="edit" type="button">Edit</button><button class="seg" data-v="prev" type="button">Preview</button></div>
<div class="panels" id="panels" data-v="edit"><div class="panel" id="edit"><div class="pt">Markdown</div><textarea id="markdown-input" placeholder="Run the Pro Agent, or paste Markdown here…"></textarea></div>
<div class="panel" id="prevp"><div class="pt">Answer sheet</div><div id="preview-wrap"><div id="preview"></div></div></div></div></main></div>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id),md=$('markdown-input'),pv=$('preview'),wrap=$('preview-wrap');
const F=['name','roll','class','year','group','section','college','faculty','femail'],LB={name:'Name',roll:'Roll No.',class:'Class',year:'Year',group:'Group',section:'Section',college:'College',faculty:'Faculty'};
const D=Object.fromEntries(F.map(k=>[k,$('d-'+k)])),KEY='asw-draft-v2';let seq=0,mode='sys',tm;
const toast=m=>{const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tm);tm=setTimeout(()=>t.classList.remove('show'),2200)};
try{mermaid.initialize({startOnLoad:false,theme:'default',securityLevel:'strict'})}catch{}
const esc=s=>s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
function hl(root,names){const src='('+names.map(esc).join('|')+')',re=new RegExp(src,'gi'),t1=new RegExp(src,'i'),w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),ns=[];
while(w.nextNode())ns.push(w.currentNode);
ns.forEach(n=>{if(n.parentNode.closest('pre,code,mark')||!t1.test(n.nodeValue))return;const f=document.createDocumentFragment();
n.nodeValue.split(re).forEach((s,i)=>{if(i%2){const m=document.createElement('mark');m.className='name';m.textContent=s;f.append(m)}else f.append(s)});n.replaceWith(f)})}
async function render(){const id=++seq;
if(!window.marked||!window.DOMPurify){pv.textContent='Libraries failed to load. Check your connection and reload.';return}
const root=document.createElement('div');
root.innerHTML=DOMPurify.sanitize(marked.parse(md.value.replace(/==([^=\n]+)==/g,'<mark class="key">$1</mark>')));
const names=[D.name.value,D.faculty.value].map(s=>s.trim()).filter(s=>s.length>2);if(names.length)hl(root,names);
const nodes=[...root.querySelectorAll('pre>code.language-mermaid')].map(c=>{const d=document.createElement('div');d.className='mermaid';d.dataset.src=c.textContent;c.parentNode.replaceWith(d);return d});
for(const [i,n] of nodes.entries()){try{n.innerHTML=(await mermaid.render('mm'+id+'_'+i,n.dataset.src)).svg}
catch{document.getElementById('dmm'+id+'_'+i)?.remove();n.className='fb';n.textContent='Diagram could not be drawn. Fix the Mermaid code in the editor.'}
if(id!==seq)return}
const items=[];const filled=F.slice(0,8).filter(k=>D[k].value.trim());
if($('t-strip').checked&&filled.length){const s=document.createElement('div');s.className='strip';
filled.forEach(k=>{const sp=document.createElement('span'),b=document.createElement('b');b.textContent=LB[k]+': ';sp.append(b,D[k].value.trim());s.append(sp)});items.push(s)}
pv.replaceChildren(...items,...root.childNodes);pv.classList.toggle('nokey',!$('t-key').checked);
const w=(pv.textContent.match(/\S+/g)||[]).length;$('stats').textContent=w?`~${w} words · ~${Math.max(1,Math.ceil(w/(mode==='hw'?230:500)))} pages`:''}
let rt;const queue=()=>{clearTimeout(rt);rt=setTimeout(()=>{render();save()},250)};
function save(){try{localStorage.setItem(KEY,JSON.stringify({md:md.value,d:Object.fromEntries(F.map(k=>[k,D[k].value])),s:$('t-strip').checked,k:$('t-key').checked}))}catch{}}
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){md.value=s.md||'';F.forEach(k=>{if(s.d&&k in s.d)D[k].value=s.d[k]});$('t-strip').checked=s.s!==false;$('t-key').checked=s.k!==false}}catch{}
md.addEventListener('input',queue);F.forEach(k=>D[k].addEventListener('input',queue));['t-strip','t-key'].forEach(i=>$(i).addEventListener('change',queue));
function setMode(m){mode=m;pv.classList.toggle('hw',m==='hw');$('m-sys').classList.toggle('on',m==='sys');$('m-hw').classList.toggle('on',m==='hw');$('hw-size').style.display=m==='hw'?'flex':'none';render()}
$('m-sys').onclick=()=>setMode('sys');$('m-hw').onclick=()=>setMode('hw');$('hw-r').oninput=e=>pv.style.setProperty('--hw',e.target.value);
document.querySelectorAll('.tabs .seg').forEach(b=>b.onclick=()=>{$('panels').dataset.v=b.dataset.v;document.querySelectorAll('.tabs .seg').forEach(x=>x.classList.toggle('on',x===b))});
$('b-diag').onclick=()=>{const s='\n```mermaid\nflowchart TD\n A[Start] --> B[Step]\n B --> C[End]\n```\n',a=md.selectionStart??md.value.length;md.value=md.value.slice(0,a)+s+md.value.slice(md.selectionEnd??a);queue()};
$('b-copy').onclick=async()=>{try{await navigator.clipboard.writeText(md.value);toast('Markdown copied')}catch{toast('Copy failed')}};
$('b-dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([md.value],{type:'text/markdown'}));a.download='answer-sheet.md';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1e3)};
$('b-clear').onclick=()=>{if(confirm('Clear the editor and the saved draft?')){md.value='';try{localStorage.removeItem(KEY)}catch{}render()}};
$('b-sample').onclick=()=>{md.value=`# Question 1: Database Normalization (16 Marks)\n\n## 1. Overview\n\n==Normalization== decomposes tables to remove redundancy and the insertion, update and deletion anomalies.\n\n| Form | Rule |\n| :-- | :-- |\n| 1NF | Atomic values only |\n| 2NF | No partial dependency |\n| 3NF | No transitive dependency |\n\n\`\`\`mermaid\nflowchart LR\n A[Unnormalized] --> B[1NF] --> C[2NF] --> D[3NF] --> E[BCNF]\n\`\`\`\n\n> Mnemonic: Atomic, Partial gone, Transitive gone, Boyce key only.\n`;queue()};
$('b-print').onclick=()=>{const t=document.title;document.title='Answer Sheet - '+(D.name.value.trim()||'Student');window.print();setTimeout(()=>document.title=t,1500)};
$('b-send').onclick=async()=>{const n=D.name.value.trim()||'Student',f=new File([md.value],'answer-sheet.md',{type:'text/markdown'});
if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:'Answer sheet - '+n,text:'Answer sheet by '+n});return}catch{}}
const q=encodeURIComponent;location.href='mailto:'+D.femail.value.trim()+'?subject='+q('Answer sheet - '+n)+'&body='+q('Respected sir/madam,\n\nPlease find my answer sheet attached.\n\nRegards,\n'+n+(D.roll.value?'\nRoll No: '+D.roll.value:''))};
window.addEventListener('beforeunload',save);render();
</script>
<script src="assets/pro.js"></script><script src="assets/watermark.js"></script>
</body></html>
